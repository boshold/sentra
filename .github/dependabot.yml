# Update cadence only; install-time checks live in pnpm-workspace.yaml.
# Cooldowns match pnpm's minimumReleaseAge (3 days) so proposed versions can install.
version: 2

updates:
  - package-ecosystem: "npm" # reads pnpm-lock.yaml
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      semver-major-days: 3
      semver-minor-days: 3
      semver-patch-days: 3
    # First matching group wins, so named groups come before the catch-alls.
    groups:
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
          - "oxlint-tsgolint"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      prod-minor-patch: # batch remaining prod deps; majors stay solo PRs
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Keeps the SHA pins in workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
