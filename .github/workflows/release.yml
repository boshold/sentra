name: Release

# Shared release flow, see https://github.com/boshold/gh-actions#releasing

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      dry-run:
        description: Test and build, but push, publish and release nothing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      full: true
    secrets: inherit

  # Dependencies all come from npmjs, so publishing falls back to github.token.
  release:
    needs: ci
    uses: boshold/gh-actions/.github/workflows/release-npm.yml@main
    permissions:
      contents: write
      packages: write
    with:
      bump: ${{ inputs.bump }}
      dry-run: ${{ inputs.dry-run }}
      node-version: "22"
