name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      dry-run:
        description: Bump, build and pack, but push, publish and release nothing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Runs dependency code, so it gets no write token. Hands the release commit and tarballs on.
  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      resumed: ${{ steps.version.outputs.resumed }}
    steps:
      # The branch, not the run's sha: a repeated run has to see the release commit it pushed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          install: false
      # No dependency cache in release builds.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile

      - id: version
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: pnpm exec tsx scripts/release-version.ts

      - run: pnpm build

      # pnpm pack resolves workspace: ranges and applies .pnpmfile.cjs. Core is packed first
      # because the CLI depends on it and is published in this order.
      - name: Pack
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in packages/core packages/cli; do
            file=$(cd "$dir" && pnpm pack --json --pack-destination "$GITHUB_WORKSPACE/release" | jq -r .filename)
            basename "$file" >> release/order.txt
          done
          git bundle create release/release.bundle "refs/tags/$TAG"

      - name: Check the tarballs
        if: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          while read -r file; do npm publish "./release/$file" --access public --dry-run; done < release/order.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release/
          retention-days: 1

  # Runs no dependency code. The release environment limits publishing to the default branch.
  publish:
    needs: build
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo "::error::releases run from $DEFAULT_BRANCH, not $GITHUB_REF_NAME"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release/

      - name: Push the release commit and tag
        if: ${{ needs.build.outputs.resumed != 'true' }}
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch release/release.bundle "refs/tags/$TAG:refs/tags/$TAG"
          git push --atomic origin "refs/tags/$TAG^{commit}:refs/heads/$GITHUB_REF_NAME" "refs/tags/$TAG"

      # Node 24 ships npm 11, which supports trusted publishing (OIDC). No cache, no token.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Versions already on npm are skipped, so a failed run can be repeated.
      - name: Publish
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          npm --version
          while read -r file; do
            name=$(tar -xOzf "release/$file" package/package.json | jq -r .name)
            if [[ -n "$(npm view "$name@$VERSION" version 2>/dev/null || true)" ]]; then
              echo "$name@$VERSION is already on npm, skipping"
            else
              npm publish "./release/$file" --access public --provenance
            fi
          done < release/order.txt

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && { echo "release $TAG exists"; exit 0; }
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
