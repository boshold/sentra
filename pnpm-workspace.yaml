packages:
  - "packages/*"

# Supply-chain hardening, see https://pnpm.io/settings

# Refuse versions younger than 3 days, including transitive ones; malicious releases are usually yanked within hours.
minimumReleaseAge: 4320 # minutes (3 days)
minimumReleaseAgeStrict: true

# Fail if provenance weakens vs an earlier release (stolen-token republish).
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 4320 # skip versions older than 3 days (pre-provenance releases would fail)

# Transitive deps must come from a registry, not git or tarball URLs.
blockExoticSubdeps: true

# Only these packages may run install scripts; others fail the install.
allowBuilds:
  esbuild: true # downloads platform binary

# Verify node_modules matches the lockfile before pnpm run/exec; auto-install on mismatch.
verifyDepsBeforeRun: install
